# ── Thêm vào server block HTTPS trong /etc/nginx/sites-available/tienmai ──────
#
# Pattern chung cho mọi project dưới /projects/<name>:
#   - SPA static serve dưới /projects/<name>/ (trailing slash + alias .../dist/)
#   - API proxy /api/<name>/ → backend port riêng
# Đặt các location này TRƯỚC location / (root).

    # AI Dashboard SPA
    location = /projects/ai-dashboard {
        return 301 /projects/ai-dashboard/;
    }

    location /projects/ai-dashboard/ {
        alias /root/projects/ai-dashboard/frontend/dist/;
        try_files $uri $uri/ /projects/ai-dashboard/index.html;
    }

    # AI Dashboard API → port 8002
    location /api/ai-dashboard/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 20m;
    }
